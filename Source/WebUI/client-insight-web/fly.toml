# fly.toml app configuration file generated for clientinsight-ui-staging on 2026-01-13T08:54:19+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clientinsight-ui-staging'
primary_region = 'jnb'

[build]
  dockerfile = "src/Dockerfile" # <-- set to your UI folder + Dockerfile path


[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
